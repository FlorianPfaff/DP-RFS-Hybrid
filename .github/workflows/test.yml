name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest -q
      - name: Smoke-run examples
        run: |
          python examples/run_synthetic_birth_demo.py
          python examples/run_structured_clutter_demo.py
      - name: Smoke-run metrics script
        run: python experiments/structured_clutter_metrics.py --seeds 2 --scans 3 --output results/structured_clutter_metrics.csv
